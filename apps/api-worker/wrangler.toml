name = "syntropi-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# The public address merchants use. Cloudflare creates the DNS record and certificate itself.
routes = [{ pattern = "api.syntropi.co.uk", custom_domain = true }]
# The temporary workers.dev address and preview URLs are off: the custom domain is the only way in.
workers_dev = false
preview_urls = false

# Run the Worker next to the database, wherever the caller is. The database is in AWS eu-west-2
# (London), and every request makes a few queries: a cross-Atlantic round trip per query would
# cost far more than one hop from the caller to London. Smart Placement was not used because it
# needs traffic from several locations before it moves anything.
[placement]
region = "aws:eu-west-2"

# Created with: wrangler hyperdrive create syntropi-db --connection-string=<api_worker connection string>
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "4d5bac7c642e4c97b59cdf05897dccc3"

# Daily bank list refresh from the providers (03:00 UTC)
[triggers]
crons = ["0 3 * * *"]

[vars]
# Where the front ends live. Localhost until the Pages sites have their own domains.
DASHBOARD_URL = "http://localhost:3000"
HOSTED_PAGES_URL = "https://pay.syntropi.co.uk"
MOCK_BANK_URL = "https://bank.syntropi.co.uk"
API_BASE_URL = "https://api.syntropi.co.uk"

# Secrets (never in this file): set with `wrangler secret put <NAME>`
#   SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY, HOSTED_PAGES_JWT_SECRET,
#   TOKEN_API_KEY, YAPILY_CLIENT_ID, YAPILY_CLIENT_SECRET, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET
