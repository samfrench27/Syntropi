apis:
  # Define a name for your API
  syntropi:
    # Path to your OpenAPI definition
    root: ./openapi.yaml
    theme:
      logo:
        url: 'https://syntropi.com/logo.png'
        backgroundColor: '#5449DE'
        altText: 'Syntropi API'
      colors:
        primary:
          main: '#5449DE' # Syntropi purple
          light: '#EFEDFC' # Soft lavender
          dark: '#3F38A6' # Darker purple
        text:
          primary: '#1A1A1A'
          secondary: '#4A4A4A'
        http:
          get: '#5449DE'
          post: '#B63FDE'
          put: '#47AEDE'
          delete: '#ED6A5A'
        background:
          primary: '#FFFFFF'
          secondary: '#F7F7F7'
      typography:
        fontSize: '16px'
        lineHeight: '1.5'
        fontFamily: 'Inter, -apple-system, BlinkMacSystemFont, sans-serif'
        headings:
          fontFamily: 'Inter, -apple-system, BlinkMacSystemFont, sans-serif'
          fontWeight: 600
      sidebar:
        width: '300px'
        backgroundColor: '#F7F7F7'

# Output configuration
referenceDocs:
  htmlTemplate: ./templates/index.html
  outputDir: ./build
  theme:
    openapi:
      generateCodeSamples:
        languages:
          - lang: curl
          - lang: javascript
          - lang: python
      hideDownloadButton: false
      expandResponses: "200,201"
      jsonSampleExpandLevel: 2
      sortPropsAlphabetically: false
      showExtensions: false
      hideHostname: false
      noAutoAuth: false
      hideInfoSection: false

# Custom plugins
plugins:
  - security
  - analytics:
      gtm:
        tagId: 'GTM-XXXXXXX'  # Replace with actual GTM tag ID if needed 