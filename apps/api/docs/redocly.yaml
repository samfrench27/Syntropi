apis:
  main:
    root: openapi.yaml

theme:
  openapi:
    theme:
      logo:
        altText: Syntropi
        href: 'https://syntropi.co.uk'
      
      colors:
        primary:
          main: '#5449DE'
          light: '#EFEDFC'
          dark: '#3F38A6'
        success:
          main: '#5CB85C'
          light: '#E8F6E8'
          dark: '#4CAE4C'
        warning:
          main: '#F0AD4E'
          light: '#FCF8E3'
          dark: '#EEA236'
        error:
          main: '#D9534F'
          light: '#F9E7E7'
          dark: '#D43F3A'
        text:
          primary: '#1A1A1A'
          secondary: '#5E5E5E'
        http:
          get: '#5449DE'
          post: '#49A942'
          put: '#F9BC08'
          delete: '#E63946'
      
      typography:
        fontFamily: 'Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'
        fontSize: '16px'
        lineHeight: '1.5'
        code:
          fontFamily: 'Menlo, Monaco, Consolas, "Courier New", monospace'
      
      sidebar:
        backgroundColor: '#FFFFFF'
        textColor: '#1A1A1A'
        activeTextColor: '#5449DE'
        groupItems:
          activeBackgroundColor: '#EFEDFC'
          activeTextColor: '#5449DE'
        level1Items:
          activeBackgroundColor: '#EFEDFC'
          activeTextColor: '#5449DE'
        arrow:
          color: '#5449DE'
          size: '1.5em'

    generateCodeSamples:
      languages:
        - lang: curl
        - lang: javascript
        - lang: python
    hideDownloadButton: false
    expandResponses: "200,201"
    jsonSampleExpandLevel: 2
    sortPropsAlphabetically: false
    showExtensions: false
    hideHostname: false
    noAutoAuth: false
    hideInfoSection: false 