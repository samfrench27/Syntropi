openapi: 3.0.0
info:
  title: Syntropi Banking API
  description: |
    API for accessing bank information across multiple providers.
    
    This API allows you to retrieve comprehensive bank information including:
    - Basic bank details (name, country, logo, payment methods)
    - Feature support across all providers (account access, balance, transactions, payments)
    - Provider-specific support details and capabilities
    - Recommended provider based on feature completeness
    
    Filter banks by country, payment method, provider, and search terms.
  version: 1.1.0
  contact:
    name: Syntropi Support
    email: support@syntropi.com
    url: https://syntropi.com/support
  license:
    name: Proprietary
    url: https://syntropi.com/terms
servers:
  - url: https://api.syntropi.com/api
    description: Production API
  - url: https://api-staging.syntropi.com/api
    description: Staging API

tags:
  - name: Banks
    description: Operations related to bank information and synchronization

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: API key for authentication

  schemas:
    Bank:
      type: object
      properties:
        id:
          type: string
          description: "Unique identifier for the bank"
          example: "gb-hsbc-bank-personal"
        name:
          type: string
          description: "Human-readable name of the bank"
          example: "HSBC Bank - Personal"
        country:
          type: string
          description: "ISO 3166-1 alpha-2 country code"
          example: "GB"
        logoUrl:
          type: string
          format: uri
          description: "URL to the bank's logo image"
          example: "https://s3-us-west-2.amazonaws.com/tokenio-assets/1.0.0/logos/hsbc/hsbc_square.png"
        supportedPaymentMethods:
          type: array
          items:
            type: string
          description: "List of payment methods supported by this bank"
          example: ["faster_payments", "chaps", "sepa"]
        active:
          type: boolean
          description: "Whether the bank is currently active and available"
          example: true
        features:
          $ref: '#/components/schemas/BankFeatures'
        providerSupport:
          type: object
          description: "Details of which providers support this bank and their capabilities"
          additionalProperties:
            $ref: '#/components/schemas/ProviderSupport'
          example:
            token:
              available: true
              features: ["accountAccess", "accountBalance", "transactions", "payments"]
              providerId: "ob-hsbc-per"
              lastUpdated: "2025-04-22T19:01:51.702Z"
        recommendedProvider:
          type: string
          nullable: true
          description: "Name of the recommended provider based on feature completeness and availability"
          example: "token"

    BankFeatures:
      type: object
      description: "Summary of features available for this bank across all providers"
      properties:
        accountAccess:
          type: boolean
          description: "Whether account listing is supported"
          example: true
        accountBalance:
          type: boolean
          description: "Whether account balance retrieval is supported"
          example: true
        transactions:
          type: boolean
          description: "Whether transaction history is supported"
          example: true
        payments:
          type: boolean
          description: "Whether single payments are supported"
          example: true

    ProviderSupport:
      type: object
      description: "Details of a provider's support for a specific bank"
      properties:
        available:
          type: boolean
          description: "Whether this provider is active and available for this bank"
          example: true
        features:
          type: array
          items:
            type: string
            enum: ["accountAccess", "accountBalance", "transactions", "payments"]
          description: "List of features supported by this provider for this bank"
          example: ["accountAccess", "accountBalance", "transactions", "payments"]
        providerId:
          type: string
          description: "Provider-specific identifier for this bank"
          example: "ob-hsbc-per"
        lastUpdated:
          type: string
          format: date-time
          description: "When this provider's information was last updated"
          example: "2025-04-22T19:01:51.702Z"
    
    Provider:
      type: object
      properties:
        code:
          type: string
          example: "token"
    
    Pagination:
      type: object
      properties:
        total:
          type: integer
          example: 100
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        pages:
          type: integer
          example: 5
    
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            message:
              type: string
              example: "Invalid API key"

    BankListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            banks:
              type: array
              items:
                $ref: '#/components/schemas/Bank'
            pagination:
              $ref: '#/components/schemas/Pagination'
      example:
        success: true
        data:
          banks:
            - id: "gb-hsbc-bank-personal"
              name: "HSBC Bank - Personal"
              country: "GB"
              logoUrl: "https://s3-us-west-2.amazonaws.com/tokenio-assets/1.0.0/logos/hsbc/hsbc_square.png"
              supportedPaymentMethods: ["faster_payments", "chaps", "sepa"]
              active: true
              features:
                accountAccess: true
                accountBalance: true
                transactions: true
                payments: true
              providerSupport:
                token:
                  available: true
                  features: ["accountAccess", "accountBalance", "transactions", "payments"]
                  providerId: "ob-hsbc-per"
                  lastUpdated: "2025-04-22T19:01:51.702Z"
              recommendedProvider: "token"
            - id: "gb-barclays-bank"
              name: "Barclays Bank"
              country: "GB"
              logoUrl: "https://s3-us-west-2.amazonaws.com/tokenio-assets/1.0.0/logos/barclays/barclays_square.png"
              supportedPaymentMethods: ["faster_payments", "chaps", "sepa"]
              active: true
              features:
                accountAccess: true
                accountBalance: true
                transactions: true
                payments: true
              providerSupport:
                token:
                  available: true
                  features: ["accountAccess", "accountBalance", "transactions", "payments"]
                  providerId: "ob-barclays"
                  lastUpdated: "2025-04-22T19:01:51.702Z"
              recommendedProvider: "token"
          pagination:
            total: 51
            page: 1
            limit: 100
            pages: 1
    
    BankResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            bank:
              $ref: '#/components/schemas/Bank'
      example:
        success: true
        data:
          bank:
            id: "gb-hsbc-bank-personal"
            name: "HSBC Bank - Personal"
            country: "GB"
            logoUrl: "https://s3-us-west-2.amazonaws.com/tokenio-assets/1.0.0/logos/hsbc/hsbc_square.png"
            supportedPaymentMethods: ["faster_payments", "chaps", "sepa"]
            active: true
            features:
              accountAccess: true
              accountBalance: true
              transactions: true
              payments: true
            providerSupport:
              token:
                available: true
                features: ["accountAccess", "accountBalance", "transactions", "payments"]
                providerId: "ob-hsbc-per"
                lastUpdated: "2025-04-22T19:01:51.702Z"
            recommendedProvider: "token"
    
    ProvidersResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            providers:
              type: array
              items:
                type: string
              example: ["token", "yapily", "truelayer", "tink"]
    
    SyncResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Bank synchronization completed"
        data:
          type: object
          additionalProperties:
            type: object
            properties:
              created:
                type: integer
                example: 5
              updated:
                type: integer
                example: 10
              skipped:
                type: integer
                example: 2
              total:
                type: integer
                example: 17

paths:
  /banks:
    get:
      operationId: listBanks
      summary: List all banks
      description: |
        Returns a list of banks with optional filtering by country, provider, payment method, and search term.
        Results are paginated.
      tags:
        - Banks
      security:
        - ApiKeyAuth: []
      parameters:
        - name: country
          in: query
          description: Filter by ISO 3166-1 alpha-2 country code
          schema:
            type: string
            example: "GB"
        - name: provider
          in: query
          description: Filter by banking provider
          schema:
            type: string
            example: "token"
        - name: paymentMethod
          in: query
          description: Filter by supported payment method
          schema:
            type: string
            example: "sepa"
        - name: search
          in: query
          description: Search term to filter bank names
          schema:
            type: string
            example: "national"
        - name: page
          in: query
          description: Page number for pagination
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          description: Number of results per page
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 500
      responses:
        '200':
          description: List of banks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankListResponse'
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /banks/providers:
    get:
      operationId: listProviders
      summary: Get supported banking providers
      description: Returns a list of all supported banking providers
      tags:
        - Banks
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: List of providers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvidersResponse'
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /banks/{id}:
    get:
      operationId: getBankById
      summary: Get bank details
      description: Returns detailed information about a specific bank
      tags:
        - Banks
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Bank ID
          schema:
            type: string
      responses:
        '200':
          description: Bank details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankResponse'
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Bank not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /banks/sync:
    post:
      operationId: syncBanks
      summary: Sync banks from providers
      description: |
        Admin-only endpoint to synchronize bank information from providers.
        Optional query parameter to specify which provider to sync.
      tags:
        - Banks
      security:
        - ApiKeyAuth: []
      parameters:
        - name: provider
          in: query
          description: Specific provider to sync (omit to sync all)
          schema:
            type: string
            example: "token"
      responses:
        '200':
          description: Sync results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'