openapi: 3.0.0
info:
  title: Syntropi Banking API
  description: |
    API for accessing bank information across multiple providers.
    
    This API allows you to retrieve comprehensive bank information including:
    - Basic bank details (name, country, logo, payment methods)
    - Feature support across all providers (account access, balance, transactions, payments)
    - Provider-specific support details and capabilities
    - Recommended provider based on feature completeness
    
    Filter banks by country, payment method, provider, and search terms.
  version: 1.1.0
  contact:
    name: Syntropi Support
    email: support@syntropi.co.uk
    url: https://syntropi.co.uk/support
  license:
    name: Proprietary
    url: https://syntropi.co.uk/terms
servers:
  - url: https://api.syntropi.co.uk/api
    description: Production API
  - url: https://api-staging.syntropi.co.uk/api
    description: Staging API

tags:
  - name: Banks
    description: Operations related to bank information and synchronization
  - name: Payments
    description: Operations for initiating and managing Single Immediate Payments

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: API key for authentication

  schemas:
    Bank:
      type: object
      properties:
        id:
          type: string
          description: "Unique identifier for the bank"
          example: "gb-hsbc-bank-personal"
        name:
          type: string
          description: "Human-readable name of the bank"
          example: "HSBC Bank - Personal"
        country:
          type: string
          description: "ISO 3166-1 alpha-2 country code"
          example: "GB"
        logoUrl:
          type: string
          format: uri
          description: "URL to the bank's logo image"
          example: "https://s3-us-west-2.amazonaws.com/tokenio-assets/1.0.0/logos/hsbc/hsbc_square.png"
        supportedPaymentMethods:
          type: array
          items:
            type: string
          description: "List of payment methods supported by this bank"
          example: ["faster_payments", "chaps", "sepa"]
        active:
          type: boolean
          description: "Whether the bank is currently active and available"
          example: true
        features:
          $ref: '#/components/schemas/BankFeatures'
        providerSupport:
          type: object
          description: "Details of which providers support this bank and their capabilities"
          additionalProperties:
            $ref: '#/components/schemas/ProviderSupport'
          example:
            token:
              available: true
              features: ["accountAccess", "accountBalance", "transactions", "payments"]
              providerId: "ob-hsbc-per"
              lastUpdated: "2025-04-22T19:01:51.702Z"
        recommendedProvider:
          type: string
          nullable: true
          description: "Name of the recommended provider based on feature completeness and availability"
          example: "token"

    BankFeatures:
      type: object
      description: "Summary of features available for this bank across all providers"
      properties:
        accountAccess:
          type: boolean
          description: "Whether account listing is supported"
          example: true
        accountBalance:
          type: boolean
          description: "Whether account balance retrieval is supported"
          example: true
        transactions:
          type: boolean
          description: "Whether transaction history is supported"
          example: true
        payments:
          type: boolean
          description: "Whether single payments are supported"
          example: true

    ProviderSupport:
      type: object
      description: "Details of a provider's support for a specific bank"
      properties:
        available:
          type: boolean
          description: "Whether this provider is active and available for this bank"
          example: true
        features:
          type: array
          items:
            type: string
            enum: ["accountAccess", "accountBalance", "transactions", "payments"]
          description: "List of features supported by this provider for this bank"
          example: ["accountAccess", "accountBalance", "transactions", "payments"]
        providerId:
          type: string
          description: "Provider-specific identifier for this bank"
          example: "ob-hsbc-per"
        lastUpdated:
          type: string
          format: date-time
          description: "When this provider's information was last updated"
          example: "2025-04-22T19:01:51.702Z"
    
    Provider:
      type: object
      properties:
        code:
          type: string
          example: "token"
    
    Pagination:
      type: object
      properties:
        total:
          type: integer
          example: 100
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        pages:
          type: integer
          example: 5
    
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            message:
              type: string
              example: "Invalid API key"

    BankListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            banks:
              type: array
              items:
                $ref: '#/components/schemas/Bank'
            pagination:
              $ref: '#/components/schemas/Pagination'
      example:
        success: true
        data:
          banks:
            - id: "gb-hsbc-bank-personal"
              name: "HSBC Bank - Personal"
              country: "GB"
              logoUrl: "https://s3-us-west-2.amazonaws.com/tokenio-assets/1.0.0/logos/hsbc/hsbc_square.png"
              supportedPaymentMethods: ["faster_payments", "chaps", "sepa"]
              active: true
              features:
                accountAccess: true
                accountBalance: true
                transactions: true
                payments: true
              providerSupport:
                token:
                  available: true
                  features: ["accountAccess", "accountBalance", "transactions", "payments"]
                  providerId: "ob-hsbc-per"
                  lastUpdated: "2025-04-22T19:01:51.702Z"
              recommendedProvider: "token"
            - id: "gb-barclays-bank"
              name: "Barclays Bank"
              country: "GB"
              logoUrl: "https://s3-us-west-2.amazonaws.com/tokenio-assets/1.0.0/logos/barclays/barclays_square.png"
              supportedPaymentMethods: ["faster_payments", "chaps", "sepa"]
              active: true
              features:
                accountAccess: true
                accountBalance: true
                transactions: true
                payments: true
              providerSupport:
                token:
                  available: true
                  features: ["accountAccess", "accountBalance", "transactions", "payments"]
                  providerId: "ob-barclays"
                  lastUpdated: "2025-04-22T19:01:51.702Z"
              recommendedProvider: "token"
          pagination:
            total: 51
            page: 1
            limit: 100
            pages: 1
    
    BankResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            bank:
              $ref: '#/components/schemas/Bank'
      example:
        success: true
        data:
          bank:
            id: "gb-hsbc-bank-personal"
            name: "HSBC Bank - Personal"
            country: "GB"
            logoUrl: "https://s3-us-west-2.amazonaws.com/tokenio-assets/1.0.0/logos/hsbc/hsbc_square.png"
            supportedPaymentMethods: ["faster_payments", "chaps", "sepa"]
            active: true
            features:
              accountAccess: true
              accountBalance: true
              transactions: true
              payments: true
            providerSupport:
              token:
                available: true
                features: ["accountAccess", "accountBalance", "transactions", "payments"]
                providerId: "ob-hsbc-per"
                lastUpdated: "2025-04-22T19:01:51.702Z"
            recommendedProvider: "token"
    
    ProvidersResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            providers:
              type: array
              items:
                type: string
              example: ["token", "yapily", "truelayer", "tink"]
    
    SyncResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Bank synchronization completed"
        data:
          type: object
          additionalProperties:
            type: object
            properties:
              created:
                type: integer
                example: 5
              updated:
                type: integer
                example: 10
              skipped:
                type: integer
                example: 2
              total:
                type: integer
                example: 17

    # Payment-related schemas
    PaymentStatus:
      type: string
      enum:
        - PENDING
        - AUTHORIZING
        - AUTHORIZED
        - SUBMITTED
        - ACCEPTED
        - COMPLETED
        - FAILED
        - CANCELLED
        - EXPIRED
      description: Status of the payment
      example: "PENDING"

    PaymentFlowType:
      type: string
      enum:
        - API_ONLY
        - HOSTED_PAGES
        - EMBEDDED_HOSTED_PAGES
      description: |
        The integration flow type for the payment:
        - API_ONLY: Full API integration where TPP handles all UI
        - HOSTED_PAGES: Token.io hosted pages handle bank selection and authentication
        - EMBEDDED_HOSTED_PAGES: Token.io hosted pages for authentication only (bankId required)
      example: "API_ONLY"

    AccountDetails:
      type: object
      properties:
        accountNumber:
          type: string
          description: Account number (for UK payments)
          example: "12345678"
        sortCode:
          type: string
          description: Sort code (for UK payments)
          example: "12-34-56"
        iban:
          type: string
          description: IBAN (for SEPA payments)
          example: "GB29NWBK60161331926819"
        bic:
          type: string
          description: BIC/SWIFT code (for SEPA payments)
          example: "NWBKGB2L"
        accountName:
          type: string
          description: Name of the account holder
          example: "John Doe"
        bankName:
          type: string
          description: Name of the bank
          example: "HSBC Bank"
      required:
        - accountName

    Amount:
      type: object
      properties:
        value:
          type: string
          description: Amount as decimal string
          example: "100.50"
        currency:
          type: string
          description: ISO 4217 currency code
          example: "GBP"
      required:
        - value
        - currency

    PaymentReference:
      type: object
      properties:
        reference:
          type: string
          description: Payment reference/description
          example: "Invoice INV-001"
        endToEndId:
          type: string
          description: End-to-end identification
          example: "E2E-12345"

    CreatePaymentRequest:
      type: object
      properties:
        fromAccount:
          $ref: '#/components/schemas/AccountDetails'
          description: Source account details (optional for some flows)
        toAccount:
          $ref: '#/components/schemas/AccountDetails'
          description: Destination account details
        amount:
          $ref: '#/components/schemas/Amount'
        reference:
          $ref: '#/components/schemas/PaymentReference'
        flowType:
          $ref: '#/components/schemas/PaymentFlowType'
        redirectUrl:
          type: string
          format: uri
          description: URL to redirect to after payment completion
          example: "https://your-app.com/payment-complete"
        provider:
          type: string
          description: Payment provider to use
          example: "token"
        bankId:
          type: string
          description: Bank identifier (required for EMBEDDED_HOSTED_PAGES flow)
          example: "gb-hsbc-bank-personal"
      required:
        - toAccount
        - amount
        - provider
      example:
        toAccount:
          iban: "GB29NWBK60161331926819"
          accountName: "Jane Smith"
        amount:
          value: "100.00"
          currency: "GBP"
        reference:
          reference: "Payment for services"
        flowType: "API_ONLY"
        provider: "token"

    PaymentResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            paymentId:
              type: string
              example: "pay_1234567890abcdef"
            status:
              $ref: '#/components/schemas/PaymentStatus'
            redirectUrl:
              type: string
              format: uri
              nullable: true
              description: URL to redirect to for payment authorization
              example: "https://auth.token.io/payment/xyz"
            provider:
              type: string
              example: "token"
            bankId:
              type: string
              nullable: true
              example: "gb-hsbc-bank-personal"
            amount:
              $ref: '#/components/schemas/Amount'
            createdAt:
              type: string
              format: date-time
              example: "2025-01-07T10:00:00Z"
            expiresAt:
              type: string
              format: date-time
              nullable: true
              example: "2025-01-08T10:00:00Z"

    PaymentDetail:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            paymentId:
              type: string
              example: "pay_1234567890abcdef"
            status:
              $ref: '#/components/schemas/PaymentStatus'
            provider:
              type: string
              example: "token"
            bankId:
              type: string
              nullable: true
              example: "gb-hsbc-bank-personal"
            amount:
              $ref: '#/components/schemas/Amount'
            fromAccount:
              $ref: '#/components/schemas/AccountDetails'
            toAccount:
              $ref: '#/components/schemas/AccountDetails'
            reference:
              $ref: '#/components/schemas/PaymentReference'
            flowType:
              $ref: '#/components/schemas/PaymentFlowType'
            redirectUrl:
              type: string
              format: uri
              nullable: true
              example: "https://your-app.com/payment-complete"
            createdAt:
              type: string
              format: date-time
              example: "2025-01-07T10:00:00Z"
            updatedAt:
              type: string
              format: date-time
              example: "2025-01-07T10:05:00Z"
            expiresAt:
              type: string
              format: date-time
              nullable: true
              example: "2025-01-08T10:00:00Z"
            completedAt:
              type: string
              format: date-time
              nullable: true
              example: "2025-01-07T10:10:00Z"
            statusHistory:
              type: array
              items:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/PaymentStatus'
                  timestamp:
                    type: string
                    format: date-time
                  provider:
                    type: string
                  details:
                    type: string
            providerRedirectUrl:
              type: string
              format: uri
              nullable: true
              description: Provider-specific redirect URL for authorization
              example: "https://auth.token.io/payment/xyz"

    PaymentList:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            payments:
              type: array
              items:
                $ref: '#/components/schemas/PaymentDetail'
            total:
              type: integer
              example: 25
            limit:
              type: integer
              example: 20
            offset:
              type: integer
              example: 0

    PaymentProviderList:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            providers:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    example: "token"
                  name:
                    type: string
                    example: "token"
                  supportsPayments:
                    type: boolean
                    example: true
              example:
                - id: "token"
                  name: "token"
                  supportsPayments: true

paths:
  /banks:
    get:
      operationId: listBanks
      summary: List all banks
      description: |
        Returns a list of banks with optional filtering by country, provider, payment method, and search term.
        Results are paginated.
      tags:
        - Banks
      security:
        - ApiKeyAuth: []
      parameters:
        - name: country
          in: query
          description: Filter by ISO 3166-1 alpha-2 country code
          schema:
            type: string
            example: "GB"
        - name: provider
          in: query
          description: Filter by banking provider
          schema:
            type: string
            example: "token"
        - name: paymentMethod
          in: query
          description: Filter by supported payment method
          schema:
            type: string
            example: "sepa"
        - name: search
          in: query
          description: Search term to filter bank names
          schema:
            type: string
            example: "national"
        - name: page
          in: query
          description: Page number for pagination
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          description: Number of results per page
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 500
      responses:
        '200':
          description: List of banks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankListResponse'
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /banks/providers:
    get:
      operationId: listProviders
      summary: Get supported banking providers
      description: Returns a list of all supported banking providers
      tags:
        - Banks
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: List of providers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvidersResponse'
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /banks/{id}:
    get:
      operationId: getBankById
      summary: Get bank details
      description: Returns detailed information about a specific bank
      tags:
        - Banks
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Bank ID
          schema:
            type: string
      responses:
        '200':
          description: Bank details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankResponse'
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Bank not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /banks/sync:
    post:
      operationId: syncBanks
      summary: Sync banks from providers
      description: |
        Admin-only endpoint to synchronize bank information from providers.
        Optional query parameter to specify which provider to sync.
      tags:
        - Banks
      security:
        - ApiKeyAuth: []
      parameters:
        - name: provider
          in: query
          description: Specific provider to sync (omit to sync all)
          schema:
            type: string
            example: "token"
      responses:
        '200':
          description: Sync results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /payments:
    get:
      operationId: listPayments
      summary: List payments
      description: |
        Returns a list of payments for the authenticated client.
        Results are paginated and can be filtered by status and provider.
      tags:
        - Payments
      security:
        - ApiKeyAuth: []
      parameters:
        - name: status
          in: query
          description: Filter by payment status
          schema:
            $ref: '#/components/schemas/PaymentStatus'
        - name: provider
          in: query
          description: Filter by payment provider
          schema:
            type: string
            example: "token"
        - name: limit
          in: query
          description: Number of results per page (max 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          description: Number of results to skip
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: List of payments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentList'
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createPayment
      summary: Create a new payment
      description: |
        Initiates a new Single Immediate Payment using the specified provider.
        Supports different flow types for various integration approaches.
      tags:
        - Payments
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
      responses:
        '201':
          description: Payment created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /payments/providers:
    get:
      operationId: listPaymentProviders
      summary: List supported payment providers
      description: Returns a list of payment providers supported by the API
      tags:
        - Payments
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: List of supported providers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentProviderList'
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /payments/{paymentId}:
    get:
      operationId: getPayment
      summary: Get payment details
      description: Returns details of a specific payment
      tags:
        - Payments
      security:
        - ApiKeyAuth: []
      parameters:
        - name: paymentId
          in: path
          required: true
          description: Unique payment identifier
          schema:
            type: string
            example: "pay_1234567890abcdef"
      responses:
        '200':
          description: Payment details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentDetail'
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Payment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /payments/{paymentId}/cancel:
    post:
      operationId: cancelPayment
      summary: Cancel a payment
      description: |
        Cancels a payment if it is in a cancellable state.
        Payments can only be cancelled before they are completed or failed.
      tags:
        - Payments
      security:
        - ApiKeyAuth: []
      parameters:
        - name: paymentId
          in: path
          required: true
          description: Unique payment identifier
          schema:
            type: string
            example: "pay_1234567890abcdef"
      responses:
        '200':
          description: Payment cancelled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentDetail'
        '400':
          description: Payment cannot be cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Payment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /payments/{paymentId}/sync:
    post:
      operationId: syncPaymentStatus
      summary: Sync payment status
      description: |
        Synchronizes the payment status with the provider.
        This will update the payment status to reflect the latest state from the banking provider.
      tags:
        - Payments
      security:
        - ApiKeyAuth: []
      parameters:
        - name: paymentId
          in: path
          required: true
          description: Unique payment identifier
          schema:
            type: string
            example: "pay_1234567890abcdef"
      responses:
        '200':
          description: Payment status synchronized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentDetail'
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Payment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'